version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: gems-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: GemsGroups@2020
      MYSQL_DATABASE: GemsGroupWebApp

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -pGemsGroups@2020 || exit 1"]
      interval: 10s
      retries: 10

  backend:

    build: ./GemsBackend

    container_name: gems-backend

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/GemsGroupWebApp?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: GemsGroups@2020

    expose:
      - "8080"

  frontend:

    build: ./Gems-react-web

    container_name: gems-frontend

    restart: always

    expose:
      - "5173"

  nginx:

    image: nginx:latest

    container_name: gems-nginx

    restart: always

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  mysql-data: